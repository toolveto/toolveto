name: 'ToolVeto MCP Reliability & Chaos Gate'
description: 'Deterministic Chaos Testing, CI Blocking Gates & Auto-Remediation for MCP Servers (<90s, $0, zero LLM)'
author: 'ToolVeto Inc.'
branding:
  icon: 'shield'
  color: 'red'

inputs:
  target:
    description: 'Path to local MCP server directory, binary, schema JSON, or Streamable HTTP URL'
    required: false
  server-path:
    description: 'Path to local MCP server directory, binary, or schema JSON (alias for target)'
    required: false
    default: '.'
  server-url:
    description: 'Remote Streamable HTTP MCP server URL (if testing live endpoint)'
    required: false
  fail-on-severity:
    description: 'Minimum failure severity to block PR merge (CRITICAL | HIGH | MEDIUM)'
    required: false
    default: 'CRITICAL'
  fail-on-veto:
    description: 'Fail with non-zero exit code when a fatal safety veto is triggered'
    required: false
    default: 'true'
  threshold:
    description: 'Minimum certification score threshold (0-100)'
    required: false
    default: '80'
  ephemeral-mock:
    description: 'Enable zero-setup ephemeral mock chaos evaluation on static manifests'
    required: false
    default: 'true'
  lockfile-verify:
    description: 'Verify toolveto.lock.json against schema drift / rug-pulls if present'
    required: false
    default: 'true'
  license-key:
    description: 'ToolVeto Cloud license key (tv_live_...) for continuous drift monitoring and audit history'
    required: false
  toolveto-token:
    description: 'ToolVeto Cloud token (alias for license-key)'
    required: false
  api-url:
    description: 'ToolVeto Cloud API base URL'
    required: false
    default: 'https://toolveto.ai'
  with-llm:
    description: 'Enable Stage 4 LLM E_heal self-heal judge'
    required: false
    default: 'false'

outputs:
  score:
    description: 'Evaluated reliability score (0-100)'
    value: ${{ steps.run-gate.outputs.score }}
  tier:
    description: 'Certification tier awarded'
    value: ${{ steps.run-gate.outputs.tier }}
  passed:
    description: 'True if no merge-blocking fatal vetoes or threshold failures were encountered'
    value: ${{ steps.run-gate.outputs.passed }}
  report-url:
    description: 'Shareable audit result link'
    value: ${{ steps.run-gate.outputs.report-url }}

runs:
  using: 'composite'
  steps:
    - name: Run ToolVeto CI Gate
      id: run-gate
      shell: bash
      env:
        INPUT_TARGET: ${{ inputs.server-url || inputs.target || inputs.server-path }}
        INPUT_LICENSE: ${{ inputs.license-key || inputs.toolveto-token }}
        INPUT_FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        INPUT_THRESHOLD: ${{ inputs.threshold }}
        INPUT_API_URL: ${{ inputs.api-url }}
        INPUT_FAIL_ON_VETO: ${{ inputs.fail-on-veto }}
        INPUT_SERVER_URL: ${{ inputs.server-url }}
        INPUT_EPHEMERAL_MOCK: ${{ inputs.ephemeral-mock }}
        INPUT_WITH_LLM: ${{ inputs.with-llm }}
        INPUT_LOCKFILE_VERIFY: ${{ inputs.lockfile-verify }}
        GITHUB_REPO: ${{ github.repository }}
        ACTION_PATH: ${{ github.action_path }}
        TOOLVETO_API_URL: ${{ inputs.api-url }}
      run: |
        TARGET="${INPUT_TARGET:-.}"
        export TOOLVETO_LICENSE_KEY="${INPUT_LICENSE:-}"
        export TOOLVETO_TOKEN="${INPUT_LICENSE:-}"
        echo "🛡️ Running ToolVeto Check on: $TARGET"

        ARGS=(
          "$TARGET"
          "--format" "json"
          "--fail-on-severity" "$INPUT_FAIL_ON_SEVERITY"
          "--threshold" "$INPUT_THRESHOLD"
          "--repo" "$GITHUB_REPO"
          "--api-url" "$INPUT_API_URL"
        )
        if [ "$INPUT_FAIL_ON_VETO" = "false" ]; then
          ARGS+=("--no-fail-on-veto")
        fi
        if [ -z "$INPUT_SERVER_URL" ] && [ "$INPUT_EPHEMERAL_MOCK" = "true" ]; then
          ARGS+=("--ephemeral-mock")
        fi
        if [ "$INPUT_WITH_LLM" = "true" ]; then
          ARGS+=("--with-llm")
        fi

        # Run action via local repository CLI bundle if present, pinned published npm package if live,
        # or build cleanly from checked-out action source so external customers work out-of-the-box.
        if [ -f "$ACTION_PATH/packages/cli/dist/bin/toolveto.js" ]; then
          CLI_CMD=("node" "$ACTION_PATH/packages/cli/dist/bin/toolveto.js")
        elif npm view toolveto@0.2.0 version >/dev/null 2>&1; then
          CLI_CMD=("npx" "--yes" "toolveto@0.2.0")
        else
          echo "🔧 Building ToolVeto CLI from checked-out GitHub Action source..." >&2
          (
            cd "$ACTION_PATH"
            corepack enable >/dev/null 2>&1 || true
            if ! command -v pnpm >/dev/null 2>&1; then
              npm install -g pnpm@10.5.2 >/dev/null 2>&1
            fi
            pnpm install --frozen-lockfile >&2
            pnpm --filter toolveto... run build >&2
          )
          CLI_CMD=("node" "$ACTION_PATH/packages/cli/dist/bin/toolveto.js")
        fi

        set +e
        REPORT_JSON=$("${CLI_CMD[@]}" check "${ARGS[@]}" 2>&1)
        EXIT_CODE=$?
        set -e

        # Emit GitHub Actions file annotations & readable summary from JSON report
        REPORT_RAW="$REPORT_JSON" TARGET_URI="$TARGET" node -e '
          try {
            const raw = process.env.REPORT_RAW || "";
            const idx = raw.indexOf("{");
            const d = JSON.parse(idx >= 0 ? raw.slice(idx) : raw);
            const results = Array.isArray(d.results) ? d.results : [];
            const failed = results.filter((r) => r.status === "FAIL");
            const passed = results.filter((r) => r.status === "PASS");
            console.log(`📊 Score: ${d.score ?? 0}/100 [${d.tier || "REJECTED"}] • Passed: ${passed.length} • Failed: ${failed.length}`);
            for (const r of failed) {
              const lvl = r.severity === "CRITICAL" || r.severity === "HIGH" ? "error" : "warning";
              const msg = String(r.description || "").replace(/\r?\n/g, " ");
              console.log(`::${lvl} title=${r.checkId} (${r.tool})::${msg}`);
            }
          } catch {}
        '

        # Optional rug-pull lockfile verification when toolveto.lock.json is committed
        LOCK_EXIT=0
        if [ "$INPUT_LOCKFILE_VERIFY" = "true" ] && [ -f "${TARGET%/}/toolveto.lock.json" ]; then
          set +e
          "${CLI_CMD[@]}" lock "$TARGET" --verify --output "${TARGET%/}/toolveto.lock.json" --repo "$GITHUB_REPO" --api-url "$INPUT_API_URL"
          LOCK_EXIT=$?
          set -e
          if [ "$LOCK_EXIT" -ne 0 ]; then
            EXIT_CODE="$LOCK_EXIT"
          fi
        fi

        # Parse output fields safely from pretty-printed JSON
        SCORE=$(REPORT_RAW="$REPORT_JSON" node -e 'try { const raw = process.env.REPORT_RAW || ""; const idx = raw.indexOf("{"); const d = JSON.parse(idx >= 0 ? raw.slice(idx) : raw); console.log(d.score ?? 0); } catch { console.log(0); }')
        TIER=$(REPORT_RAW="$REPORT_JSON" node -e 'try { const raw = process.env.REPORT_RAW || ""; const idx = raw.indexOf("{"); const d = JSON.parse(idx >= 0 ? raw.slice(idx) : raw); console.log(d.tier || "REJECTED"); } catch { console.log("REJECTED"); }')
        PASSED=$([ "$EXIT_CODE" -eq 0 ] && echo "true" || echo "false")
        REPORT_URL="https://toolveto.ai/verify?score=$SCORE&tier=$TIER"

        echo "score=$SCORE" >> "$GITHUB_OUTPUT"
        echo "tier=$TIER" >> "$GITHUB_OUTPUT"
        echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
        echo "report-url=$REPORT_URL" >> "$GITHUB_OUTPUT"

        if [ "$EXIT_CODE" -ne 0 ]; then
          echo "❌ ToolVeto reliability gate blocked with exit code $EXIT_CODE."
          exit "$EXIT_CODE"
        fi
        echo "✅ ToolVeto reliability gate passed with score $SCORE/100 [$TIER]."
