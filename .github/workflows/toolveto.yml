name: ToolVeto Agent Reliability Gate

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master]

concurrency:
  group: toolveto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolveto-gate:
    name: ToolVeto CI Merge-Blocking Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - name: Install & Build Local Monorepo
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Run Deterministic ToolVeto Battery
        id: toolveto
        continue-on-error: true
        run: |
          echo "Executing ToolVeto 12-Check Battery on Fixture Server..."
          node packages/cli/dist/bin/toolveto.js check fixtures/good-server/index.js --format github-pr

      - name: Generate Actionable AST Patch (If Failed)
        if: steps.toolveto.outcome == 'failure'
        run: |
          echo "Generating 3-line AST drop-in patches for Zod/Pydantic/Go..."
          node packages/cli/dist/bin/toolveto.js fix . || true

      - name: Mint RFC 7515 JWS Compliance Attestation
        run: |
          node packages/cli/dist/bin/toolveto.js evidence --demo -o toolveto-attestation.jws || true

      - name: Upload Compliance Attestation Token
        uses: actions/upload-artifact@v4
        with:
          name: toolveto-attestation-evidence
          path: toolveto-attestation.jws
          retention-days: 90
          if-no-files-found: ignore

      - name: Fail CI Job on Invariant Violation
        if: steps.toolveto.outcome == 'failure'
        run: |
          echo "⛔ ToolVeto Gate Blocked: Critical invariant violation detected."
          echo "Review the PR comments and run 'npx toolveto fix --apply' to resolve."
          exit 1
