name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build Monorepo Packages
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run Tests
        run: pnpm run test

      - name: Run Latency Micro-Benchmark
        run: pnpm run bench
