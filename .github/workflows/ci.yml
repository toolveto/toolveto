name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Lint, Live Stores, Real MCP SDK E2E & Tarball Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: toolveto_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d toolveto_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      POSTGRES_URL: postgresql://postgres:postgres_ci_password@127.0.0.1:5432/toolveto_ci
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Supply-Chain Vulnerability Gate (pnpm audit)
        run: pnpm audit --audit-level=high

      - name: Verify No Hardcoded Default Secrets
        run: |
          echo "Scanning for hardcoded fallback secrets..."
          if grep -rnE "toolveto-default-|toolveto-demo-secret" packages/ ; then
            echo "❌ Hardcoded fallback secrets detected!"
            exit 1
          fi
          echo "✔ No hardcoded fallback secrets found."

      - name: Run Verification Gate (Lint, Typecheck, Build, Unit + Live Postgres/Redis + Real MCP SDK E2E)
        run: ./verify.sh agent

      - name: Verify Live PostgreSQL 16 & Redis 7 Shield Stores Executed (Zero Skips)
        run: |
          LIVE_OUT=$(node --test packages/shield/dist/__tests__/live-stores.test.js 2>&1)
          echo "$LIVE_OUT"
          if ! echo "$LIVE_OUT" | grep -q "skipped 0"; then
            echo "❌ Expected 0 skipped tests in live-stores.test.js!"
            exit 1
          fi

      - name: Verify Real Official @modelcontextprotocol/sdk Gateway & Stdio Proxy E2E
        run: |
          node --test packages/gateway/dist/__tests__/real-mcp-sdk-e2e.test.js
          node --test packages/cli/dist/src/__tests__/real-stdio-proxy.test.js

      - name: Verify Bad Server Gate Rejects, Lockfile Integrity & Acme Showcase
        run: |
          node packages/cli/dist/bin/toolveto.js check fixtures/good-server --allow-exec --skip-update-check --no-telemetry
          node packages/cli/dist/bin/toolveto.js lock fixtures/good-server -o /tmp/good-server.lock.json
          node packages/cli/dist/bin/toolveto.js lock fixtures/good-server -o /tmp/good-server.lock.json --verify
          if GITHUB_ACTIONS=false node packages/cli/dist/bin/toolveto.js check fixtures/bad-server --threshold 80 --allow-exec --skip-update-check --no-telemetry ; then
            echo "❌ Expected fixtures/bad-server --threshold 80 to exit non-zero!"
            exit 1
          fi
          echo "✔ fixtures/bad-server --threshold 80 exited non-zero as expected."
          ACME_PID=""
          acme_cleanup() {
            if [ -n "$ACME_PID" ]; then kill "$ACME_PID" >/dev/null 2>&1 || true; fi
          }
          trap acme_cleanup EXIT
          MCP_SERVER_MODE=v1-hardened PORT=4110 node examples/acme-fintech-mcp/server.mjs >/tmp/acme-ci.log 2>&1 &
          ACME_PID=$!
          ACME_READY=false
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4110/health >/dev/null 2>&1; then
              ACME_READY=true
              break
            fi
            sleep 0.5
          done
          if [ "$ACME_READY" != "true" ]; then
            echo "❌ Acme FinTech MCP server failed to start on :4110"
            cat /tmp/acme-ci.log || true
            exit 1
          fi
          node packages/cli/dist/bin/toolveto.js check http://127.0.0.1:4110/mcp --allow-destructive --threshold 80 --skip-update-check --no-telemetry
          curl -fsS -X POST http://127.0.0.1:4110/admin/mode -H 'Content-Type: application/json' -d '{"mode":"v1-vulnerable"}' >/dev/null
          if GITHUB_ACTIONS=false node packages/cli/dist/bin/toolveto.js check http://127.0.0.1:4110/mcp --threshold 80 --skip-update-check --no-telemetry ; then
            echo "❌ Expected examples/acme-fintech-mcp (v1-vulnerable) --threshold 80 to exit non-zero!"
            exit 1
          fi
          acme_cleanup
          ACME_PID=""
          trap - EXIT
          echo "✔ Acme FinTech MCP hardened passed & vulnerable vetoed as expected."

      - name: Clean Customer Tarball Install Smoke Test (pnpm pack — Full CLI Subcommand E2E)
        run: |
          set -euo pipefail
          PACK_DIR=$(mktemp -d)
          CUSTOMER_DIR=$(mktemp -d)
          trap 'rm -rf "$PACK_DIR" "$CUSTOMER_DIR"' EXIT
          (cd packages/shield && pnpm pack --pack-destination "$PACK_DIR")
          (cd packages/core && pnpm pack --pack-destination "$PACK_DIR")
          (cd packages/gateway && pnpm pack --pack-destination "$PACK_DIR")
          (cd packages/cli && pnpm pack --pack-destination "$PACK_DIR")
          cd "$CUSTOMER_DIR"
          npm init -y >/dev/null
          npm install "$PACK_DIR"/*.tgz
          npx toolveto --version
          npx toolveto-gateway --help | grep -q "toolveto-gateway"
          node -e "const s = require('@toolveto/shield'); const pg = require('@toolveto/shield/stores/postgres'); const rd = require('@toolveto/shield/stores/redis'); if (!s.ShieldMiddleware || !pg.PostgresShieldStorage || !rd.RedisShieldStorage) process.exit(1);"
          cat <<'EOF' > smoke_server.py
          from mcp.server.fastmcp import FastMCP
          mcp = FastMCP("tarball-smoke")
          @mcp.tool()
          async def list_orders(customer_id: str, **kwargs):
              """Lists all customer orders from billing backend."""
              return []
          @mcp.tool(destructiveHint=True)
          def delete_order(order_id: str):
              """Deletes an order by ID."""
              return {"ok": True}
          EOF
          if GITHUB_ACTIONS=false npx toolveto check ./smoke_server.py --profile nvidia-nim --skip-update-check --no-telemetry ; then
            echo "❌ Expected unpaginated FastMCP tarball smoke to fail --profile nvidia-nim"
            exit 1
          fi
          npx toolveto fix ./smoke_server.py --lang fastmcp --apply
          python3 -m py_compile ./smoke_server.py
          npx toolveto export-policy ./smoke_server.py --format nvidia-openshell -o openshell.yaml
          grep -qi "openshell" openshell.yaml
          npx toolveto export-policy ./smoke_server.py --format nemo-guardrails -o ./nemo-rails
          test -f ./nemo-rails/config.yml
          test -f ./nemo-rails/rails/toolveto_rails.co
          npx toolveto badge --huggingface --space acme/tarball-smoke --profile nvidia-nim --score 94 --tier Platinum -o badge.svg
          grep -q "ToolVeto NIM" badge.svg
          npx toolveto lock ./smoke_server.py -o toolveto.lock.json
          npx toolveto lock ./smoke_server.py -o toolveto.lock.json --verify
          echo "✔ Clean npm tarball installation & all flagship CLI commands verified for all 4 published packages."

      - name: Production Gateway Container Build & Live Runtime Boot Gate
        run: |
          docker build -f packages/gateway/Dockerfile -t toolveto-gateway:ci-verify .
          GW_SECRET="$(openssl rand -hex 32)"
          UPSTREAM_PID=""
          cleanup() {
            docker rm -f tv-gw-ci >/dev/null 2>&1 || true
            if [ -n "$UPSTREAM_PID" ]; then kill "$UPSTREAM_PID" >/dev/null 2>&1 || true; fi
          }
          trap cleanup EXIT
          node -e '
            const http = require("http");
            http.createServer((req, res) => {
              req.resume();
              req.on("end", () => {
                res.writeHead(200, { "Content-Type": "application/json" });
                res.end(JSON.stringify({ jsonrpc: "2.0", id: 1, result: { content: [{ type: "text", text: "ok" }] } }));
              });
            }).listen(3000, "127.0.0.1");
          ' &
          UPSTREAM_PID=$!
          docker run -d --name tv-gw-ci --network host \
            -e TOOLVETO_GATEWAY_SECRET="$GW_SECRET" \
            -e TOOLVETO_ALLOW_LOCAL_UPSTREAMS=true \
            toolveto-gateway:ci-verify
          READY=false
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/health | grep -q "healthy"; then
              READY=true
              break
            fi
            sleep 1
          done
          if [ "$READY" != "true" ]; then
            echo "❌ Gateway container failed to become healthy on :8080"
            docker logs tv-gw-ci || true
            exit 1
          fi
          UNAUTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:8080/mcp -H "Content-Type: application/json" -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"create_payment","arguments":{"amount":10}}}')
          if [ "$UNAUTH_STATUS" != "401" ]; then
            echo "❌ Expected unauthenticated container request to return 401, got $UNAUTH_STATUS"
            docker logs tv-gw-ci || true
            exit 1
          fi
          AUTH_HDR=$(curl -fsS -D - -X POST http://127.0.0.1:8080/mcp \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GW_SECRET" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"create_payment","arguments":{"amount":10,"idempotency_key":"ci-container-1"}}}')
          echo "$AUTH_HDR" | grep -iq "X-ToolVeto-Shield: active"
          echo "$AUTH_HDR" | grep -q '"ok"'
          echo "✔ Gateway Docker container booted, enforced 401 auth, and proxied authenticated Shield traffic."

      - name: Run Latency & Live HTTP Concurrency Benchmark
        run: |
          mkdir -p /tmp/toolveto-oss-ci-evidence
          BENCHMARK_JSON_OUT=/tmp/toolveto-oss-ci-evidence/oss-shield-benchmark.json pnpm run bench
          node -e '
            const fs = require("node:fs");
            const bench = JSON.parse(fs.readFileSync("/tmp/toolveto-oss-ci-evidence/oss-shield-benchmark.json", "utf8"));
            fs.writeFileSync("/tmp/toolveto-oss-ci-evidence/ci-gates-summary.json", JSON.stringify({
              repository: "toolveto/toolveto",
              commitSha: process.env.GITHUB_SHA || "local",
              executedAt: new Date().toISOString(),
              gatesPassed: [
                "pnpm audit --audit-level=high",
                "Hardcoded secret hygiene scan",
                "Lint + TypeScript compile + Full OSS test suite",
                "Live PostgreSQL 16 + Redis 7 N=100 10-pod exact-once contention tests",
                "Official @modelcontextprotocol/sdk StreamableHTTP + SSE + Stdio Proxy E2E",
                "Clean npm tarball smoke test (shield, core, gateway, cli)",
                "Production Gateway Docker fail-closed 401 + live /mcp proxy boot",
                "Shield in-memory + live TCP/HTTP concurrency & 100-way burst benchmark"
              ],
              benchmarkSnapshot: bench
            }, null, 2));
          '

      - name: Upload OSS CI & Scale Due-Diligence Evidence
        uses: actions/upload-artifact@v7
        with:
          name: toolveto-oss-due-diligence-evidence
          path: /tmp/toolveto-oss-ci-evidence/
          retention-days: 30

      - name: Publish CI Verification Summary
        if: success()
        run: |
          {
            echo "## 🛡️ ToolVeto OSS Monorepo Real-Stack CI Summary"
            echo "| Gate | Scope | Status |"
            echo "| :--- | :--- | :--- |"
            echo "| Supply-Chain Audit | \`pnpm audit --audit-level=high\` (0 high/critical advisories) | ✅ Passed |"
            echo "| Secret Hygiene Scan | Zero hardcoded fallback secrets across \`packages/\` | ✅ Passed |"
            echo "| Live Distributed Stores | \`PostgresShieldStorage\` (Postgres 16) + \`RedisShieldStorage\` (Redis 7 Lua) | ✅ Passed |"
            echo "| Official MCP SDK E2E | \`StreamableHTTPServerTransport\` + SSE + \`StdioServerTransport\` Proxy | ✅ Passed |"
            echo "| Clean Customer Tarball Smoke | \`pnpm pack\` + isolated \`npm install\` + full CLI subcommand E2E | ✅ Passed |"
            echo "| Production Container Boot | \`packages/gateway/Dockerfile\` live \`/health\`, 401 fail-closed & \`/mcp\` proxy | ✅ Passed |"
            echo "| Shield Sub-2ms Micro-Benchmark | Inline interception latency SLA | ✅ Passed |"
          } >> "$GITHUB_STEP_SUMMARY"

  cross-os-cli-smoke:
    name: Cross-OS Developer CLI Matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies & Build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Run Core & CLI Unit/Fuzz/Regression Tests on ${{ matrix.os }}
        run: |
          pnpm --filter @toolveto/core test
          node --test packages/cli/dist/src/__tests__/nvidia-policy-exporters.test.js packages/cli/dist/src/__tests__/nvidia-nim-and-fastmcp.test.js packages/cli/dist/src/__tests__/huggingface-index-and-badges.test.js packages/cli/dist/src/__tests__/fuzz-and-regression-corpus.test.js packages/cli/dist/src/__tests__/wild-environment-resilience.test.js

      - name: Cross-Platform Clean Tarball & CRLF FastMCP Smoke (${{ matrix.os }})
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const os = require("node:os");
            const path = require("node:path");
            const { execFileSync } = require("node:child_process");
            const isWin = process.platform === "win32";
            const pnpmBin = isWin ? "pnpm.cmd" : "pnpm";
            const npmBin = isWin ? "npm.cmd" : "npm";
            const npxBin = isWin ? "npx.cmd" : "npx";
            const run = (cmd, args, cwd, allowFail = false) => {
              try {
                return execFileSync(cmd, args, { cwd, encoding: "utf8", shell: isWin, stdio: "pipe" });
              } catch (err) {
                if (allowFail) return err.stdout || "";
                throw new Error(`Command failed (${cmd} ${args.join(" ")}): ${err.stderr || err.message}`);
              }
            };
            const packDir = fs.mkdtempSync(path.join(os.tmpdir(), "tv-pack-"));
            const custDir = fs.mkdtempSync(path.join(os.tmpdir(), "tv-cust-"));
            try {
              for (const pkg of ["shield", "core", "gateway", "cli"]) {
                run(pnpmBin, ["pack", "--pack-destination", packDir], path.resolve("packages", pkg));
              }
              const tarballs = fs.readdirSync(packDir).filter((f) => f.endsWith(".tgz")).map((f) => path.join(packDir, f));
              run(npmBin, ["init", "-y"], custDir);
              run(npmBin, ["install", ...tarballs], custDir);
              const ver = run(npxBin, ["toolveto", "--version"], custDir).trim();
              if (!ver) throw new Error("Empty toolveto --version");
              const pyPath = path.join(custDir, "server.py");
              const crlfPy = [
                "from mcp.server.fastmcp import FastMCP",
                "mcp = FastMCP(\"cross-os\")",
                "@mcp.tool()",
                "async def list_items(query: str, **kwargs):",
                "    \"\"\"Lists items from catalog.\"\"\"",
                "    return []",
              ].join("\r\n") + "\r\n";
              fs.writeFileSync(pyPath, crlfPy, "utf8");
              run(npxBin, ["toolveto", "fix", pyPath, "--lang", "fastmcp", "--apply"], custDir);
              const patched = fs.readFileSync(pyPath, "utf8");
              if (!patched.includes("limit: int = 25")) throw new Error("FastMCP fix failed on CRLF file");
              run(npxBin, ["toolveto", "export-policy", pyPath, "--format", "nvidia-openshell", "-o", "policy.yaml"], custDir);
              if (!fs.existsSync(path.join(custDir, "policy.yaml"))) throw new Error("Missing openshell policy.yaml");
              run(npxBin, ["toolveto", "badge", "--huggingface", "--space", "acme/cross-os", "--profile", "nvidia-nim", "--score", "95", "--tier", "Platinum", "-o", "badge.svg"], custDir);
              if (!fs.readFileSync(path.join(custDir, "badge.svg"), "utf8").includes("ToolVeto NIM")) {
                throw new Error("Missing ToolVeto NIM badge");
              }
              console.log(`✔ Cross-OS (${process.platform}) tarball CLI E2E smoke passed (v${ver})`);
            } finally {
              fs.rmSync(packDir, { recursive: true, force: true });
              fs.rmSync(custDir, { recursive: true, force: true });
            }
          '
