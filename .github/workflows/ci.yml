name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.2

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify No Hardcoded Default Secrets
        run: |
          echo "Scanning for hardcoded fallback secrets..."
          if grep -rnE "toolveto-default-|toolveto-demo-secret" packages/ ; then
            echo "❌ Hardcoded fallback secrets detected!"
            exit 1
          fi
          echo "✔ No hardcoded fallback secrets found."

      - name: Run Verification Gate (Lint, Typecheck, Build, Unit Tests)
        run: ./verify.sh agent

      - name: Verify Bad Server Gate Rejects (fixtures/bad-server --threshold 101)
        run: |
          node packages/cli/dist/bin/toolveto.js check fixtures/good-server --allow-exec --skip-update-check --no-telemetry
          if node packages/cli/dist/bin/toolveto.js check fixtures/bad-server --threshold 101 --allow-exec --skip-update-check --no-telemetry ; then
            echo "❌ Expected fixtures/bad-server --threshold 101 to exit non-zero!"
            exit 1
          fi
          echo "✔ fixtures/bad-server --threshold 101 exited non-zero as expected."

      - name: Run Latency Micro-Benchmark
        run: pnpm run bench

