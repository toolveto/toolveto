name: Security & Secret Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks Secret Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks (Git History + Working Directory)
        run: |
          GITLEAKS_VERSION="8.24.2"
          GITLEAKS_SHA256="fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          /tmp/gitleaks git . --no-banner --redact
          /tmp/gitleaks dir . --no-banner --redact

  dependency-audit:
    name: Supply-Chain Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install & Audit Dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=moderate

  semgrep-sast:
    name: Semgrep SAST (TypeScript / Node.js / OWASP Top 10)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Run Semgrep SAST
        run: |
          semgrep scan --timeout 30 --config p/typescript --config p/nodejs --config p/owasp-top-ten --error packages/

  codeql-sast:
    name: CodeQL SAST (JavaScript / TypeScript)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          upload: false
          output: codeql-results

      - name: Enforce Zero Blocking CodeQL Security Alerts
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const files = fs.readdirSync("codeql-results").filter((f) => f.endsWith(".sarif"));
            if (files.length === 0) throw new Error("No CodeQL SARIF output produced");
            const blocking = [];
            for (const f of files) {
              const sarif = JSON.parse(fs.readFileSync(path.join("codeql-results", f), "utf8"));
              for (const run of sarif.runs || []) {
                const rules = new Map((run.tool?.driver?.rules || []).map((r) => [r.id, r]));
                for (const res of run.results || []) {
                  const rule = rules.get(res.ruleId);
                  const level = res.level || rule?.defaultConfiguration?.level || "warning";
                  const secSev = Number(rule?.properties?.["security-severity"] || 0);
                  if (level === "error" || secSev >= 4.0) {
                    blocking.push({ ruleId: res.ruleId, level, secSev, msg: res.message?.text });
                  }
                }
              }
            }
            if (blocking.length > 0) {
              console.error(JSON.stringify(blocking, null, 2));
              process.exit(1);
            }
          '

  zap-dast-gateway:
    name: OWASP ZAP Runtime DAST (MCP Gateway)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup pnpm & Node 22
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Build & Boot Gateway
        run: |
          pnpm install --frozen-lockfile
          pnpm -r build
          GATEWAY_AUTH_SECRET="$(openssl rand -hex 24)" RUN_STANDALONE=true PORT=18080 node packages/gateway/dist/index.js &
          echo $! > /tmp/gw.pid
          for i in $(seq 1 20); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/health || true)" = "200" ]; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Run OWASP ZAP Baseline on Gateway
        run: |
          mkdir -p zap-wrk
          chmod 777 zap-wrk
          docker run --rm --network host \
            -v "${GITHUB_WORKSPACE}/zap-wrk:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "http://127.0.0.1:18080/health" -J "zap-gateway-report.json" || true

      - name: Stop Gateway
        if: always()
        run: kill "$(cat /tmp/gw.pid)" >/dev/null 2>&1 || true

  uptime-sentinel:
    name: Control Plane Uptime Sentinel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && vars.TOOLVETO_UPTIME_URL != ''
    steps:
      - name: Probe API Readiness Endpoint
        env:
          UPTIME_PROBE_URL: ${{ vars.TOOLVETO_UPTIME_URL }}
          SLACK_WEBHOOK_CRITICAL: ${{ secrets.SLACK_WEBHOOK_CRITICAL }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$UPTIME_PROBE_URL" || true)
          if [ -z "$STATUS" ]; then STATUS="000"; fi
          if [ "$STATUS" != "200" ]; then
            echo "::error::API Sentinel check failed for $UPTIME_PROBE_URL! Status: $STATUS"
            if [ -n "$SLACK_WEBHOOK_CRITICAL" ]; then
              curl -s -X POST -H 'Content-type: application/json' \
                --data "{\"text\":\"🚨 [CRITICAL ALERT] $UPTIME_PROBE_URL probe failed with HTTP status: $STATUS\"}" \
                "$SLACK_WEBHOOK_CRITICAL" || true
            fi
            exit 1
          fi
          echo "✔ $UPTIME_PROBE_URL healthy (200 OK)"
