name: Shield Latency Benchmark

on:
  schedule:
    - cron: '0 0 * * 1' # Weekly on Monday
  workflow_dispatch:

jobs:
  k6-benchmark:
    name: k6 500 RPS Shield Overhead Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - name: Install Dependencies
        run: pnpm install

      - name: Build Gateway and Shield
        run: pnpm run build

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Execute Overhead Verification
        run: pnpm --filter @toolveto/benchmarks-overhead run bench
