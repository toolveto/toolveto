<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 40" width="180" height="40">
  <defs>
    <linearGradient id="logo-shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900" />
      <stop offset="50%" stop-color="#ff3355" />
      <stop offset="100%" stop-color="#880033" />
    </linearGradient>
    <linearGradient id="logo-core-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffa040" />
    </linearGradient>
    <linearGradient id="logo-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ff7a00" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ff0055" stop-opacity="0.9" />
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ff7a00" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- SHIELD ICON (Left 40px) -->
  <g transform="translate(0, 0)">
    <!-- Base Glow Tile -->
    <rect width="40" height="40" rx="10" fill="#07090e" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    
    <!-- Outer Shield -->
    <path d="M20 4.5 L33 9.5 V21 C33 29 20 35 20 35 C20 35 7 29 7 21 V9.5 L20 4.5 Z" 
          fill="#0a0d16" stroke="url(#logo-border-grad)" stroke-width="1.75" stroke-linejoin="round" />

    <!-- Isometric Facets -->
    <path d="M20 6 L31.5 10.5 V20.5 C31.5 27 20 32.5 20 32.5 V6 Z" fill="url(#logo-shield-grad)" fill-opacity="0.95" />
    <path d="M20 6 L8.5 10.5 V20.5 C8.5 27 20 32.5 20 32.5 V6 Z" fill="url(#logo-shield-grad)" fill-opacity="0.65" />

    <!-- Center Laser Trace -->
    <path d="M20 8 V31" stroke="rgba(255,255,255,0.35)" stroke-width="0.75" stroke-dasharray="2 2" />
    <path d="M12 17 L20 22 L28 17" stroke="rgba(255,255,255,0.4)" stroke-width="1" fill="none" stroke-linecap="round" />

    <!-- Central Veto Glyph with Glow -->
    <path d="M14 14.5 L20 25.5 L26 14.5 L23 14.5 L20 20 L17 14.5 Z" 
          fill="url(#logo-core-grad)" filter="url(#logo-glow)" />
    <circle cx="20" cy="20" r="1.5" fill="#ffffff" />
  </g>

  <!-- WORDMARK (Right) -->
  <text x="52" y="27" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="-0.03em" fill="#f8fafc">
    TOOL<tspan fill="#ff7a00">VETO</tspan>
  </text>
</svg>
