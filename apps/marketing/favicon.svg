<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="tv-grad-shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900" />
      <stop offset="50%" stop-color="#ff3355" />
      <stop offset="100%" stop-color="#880033" />
    </linearGradient>
    <linearGradient id="tv-grad-core" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffa040" />
    </linearGradient>
    <linearGradient id="tv-grad-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ff7a00" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ff0055" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Background Base Badge -->
  <rect width="40" height="40" rx="10" fill="#07090e" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Outer Ballistic Hexagon Shield Frame -->
  <path d="M20 4.5 L33 9.5 V21 C33 29 20 35 20 35 C20 35 7 29 7 21 V9.5 L20 4.5 Z" 
        fill="#0a0d16" stroke="url(#tv-grad-border)" stroke-width="1.75" stroke-linejoin="round" />

  <!-- Shield Facet Geometry (Isometric Left/Right) -->
  <path d="M20 6 L31.5 10.5 V20.5 C31.5 27 20 32.5 20 32.5 V6 Z" fill="url(#tv-grad-shield)" fill-opacity="0.95" />
  <path d="M20 6 L8.5 10.5 V20.5 C8.5 27 20 32.5 20 32.5 V6 Z" fill="url(#tv-grad-shield)" fill-opacity="0.65" />

  <!-- Central Laser Circuit Axis -->
  <path d="M20 8 V31" stroke="rgba(255,255,255,0.35)" stroke-width="0.75" stroke-dasharray="2 2" />
  <path d="M12 17 L20 22 L28 17" stroke="rgba(255,255,255,0.4)" stroke-width="1" fill="none" stroke-linecap="round" />

  <!-- Dynamic Stylized "V" (Veto) Glyph -->
  <path d="M14 14.5 L20 25.5 L26 14.5 L23 14.5 L20 20 L17 14.5 Z" 
        fill="url(#tv-grad-core)" />

  <!-- Central Pulse Node Core -->
  <circle cx="20" cy="20" r="1.5" fill="#ffffff" />
</svg>
